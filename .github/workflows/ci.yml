name: ci

on:
  push:
  pull_request:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run tests
        run: make test

      - name: Demo smoke
        run: make demo
